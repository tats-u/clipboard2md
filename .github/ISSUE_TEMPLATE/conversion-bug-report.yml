name: Conversion bug report
description: Report an HTML to Markdown conversion result that looks wrong
title: 'Conversion bug: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a conversion problem.

        Please include the exact HTML input, the current Markdown output, the Markdown you expected, and why the current output is incorrect.
  - type: textarea
    id: problematic_html
    attributes:
      label: Problematic HTML
      description: Paste the original HTML that produced the wrong result.
      render: html
      placeholder: <p>Hello <strong>world</strong></p>
    validations:
      required: true
  - type: textarea
    id: actual_markdown
    attributes:
      label: Actual Markdown
      description: Paste the Markdown currently generated by clipboard2md.
      render: markdown
      placeholder: Hello **world**
    validations:
      required: true
  - type: textarea
    id: expected_markdown
    attributes:
      label: Expected Markdown
      description: Show the Markdown you expected instead.
      render: markdown
      placeholder: Hello **world**
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain why the generated Markdown is wrong or less desirable.
      placeholder: The current output loses semantic information / produces invalid Markdown / is harder to read because...
    validations:
      required: true
  - type: textarea
    id: conversion_settings
    attributes:
      label: Conversion settings
      description: Include the settings that were active when the conversion ran.
      placeholder: |
        - listMarker: -
        - brStyle: backslash
        - hrStyle: *
        - linkTitleStyle: remove-matching-url
        - strictCommonMark: true
        - allowRawHtml: true
    validations:
      required: true
